plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id "com.replaymod.preprocess" version "c5abb4fb12"
    id 'top.ajitech.modrinthpublish' version '1.1.0'
}

preprocess {
    strictExtraMappings = false

    def mc12100 = createNode("1.21", 1_21_00, "")
    def mc12102 = createNode("1.21.2", 1_21_02, "")
    def mc12105 = createNode("1.21.5", 1_21_05, "")
    def mc12109 = createNode("1.21.9", 1_21_09, "")
    def mc12111 = createNode("1.21.11", 1_21_11, "")
    def mc260100 = createNode("26.1", 26_01_00, "")
    def mc260200 = createNode("26.2", 26_02_00, "")
    def mc260300 = createNode("26.3", 26_03_00, "")

    mc12102.link(mc12100, null)
    mc12105.link(mc12102, null)
    mc12109.link(mc12105, null)
    mc12111.link(mc12109, null)
    mc260100.link(mc12111, null)
    mc260200.link(mc260100, null)
    mc260300.link(mc260200, null)

    for (final def node in getNodes()) {
        findProject(node.project).ext.mcVersion = node.mcVersion
    }
}

modrinthPublish {
    modName = 'Downmatica'
    projectId = 'emavu5vy'
    token = System.getenv('MODRINTH_TOKEN')
    loaders = ['fabric']
    environment = 'client_only'
    versionType = 'release'
    dependencies {
        required 'malilib'
    }
}

tasks.register('publishAll') {
    group = 'publishing'
    description = 'Run publish on all subprojects'

    subprojects.each { sp ->
        dependsOn "${sp.path}:publish"
    }
}

tasks.register('publishAllAndPublishToModrinth') {
    group = 'publishing'
    description = 'Run publish on all subprojects, collect libs, clean artifacts and publish to Modrinth'

    dependsOn 'publishAll', 'collectLibs', 'cleanArtifacts', 'publishToModrinth'
}
tasks.named('collectLibs').configure { mustRunAfter 'publishAll' }
tasks.named('cleanArtifacts').configure { mustRunAfter 'collectLibs' }
tasks.named('publishToModrinth').configure { mustRunAfter 'cleanArtifacts' }