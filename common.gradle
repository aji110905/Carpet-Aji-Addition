plugins {
    id 'maven-publish'
}

final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'

configurations {
    modRuntimeOnly.exclude group: 'net.fabricmc', module: 'fabric-loader'
}

repositories {
    mavenLocal()
    maven {
        url 'https://masa.dy.fi/maven'
    }
}

loom{
    accessWidenerPath = file("carpetajiaddition.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings loom.layered() {
            officialMojangMappings()
        }
    }
    def autoImplementation = {
        dep -> unobfuscated ? implementation(dep) : modImplementation(dep)
    }
    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    autoImplementation "carpet:fabric-carpet:${project.carpet_core_version}"
    include(autoImplementation "org.yaml:snakeyaml:${project.yaml_version}")
}

JavaVersion JAVA_VERSION

if (mcVersion >= 260000) {
    JAVA_VERSION = JavaVersion.VERSION_25
} else if (mcVersion >= 12100) {
    JAVA_VERSION = JavaVersion.VERSION_21
}

java {
    sourceCompatibility = JAVA_VERSION
    targetCompatibility = JAVA_VERSION
    withSourcesJar()
}

group = "top.ajitech"
version = "v${project.mod_version}-mc${project.minecraft_version}"

base {
    archivesName.set("carpetajiaddition")
}

jar {
    from("LICENSE")
}

processResources {
    filesMatching("fabric.mod.json") {
        expand ([
                "version": version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "carpetajiaddition"
        }
    }
    repositories {
        maven {
            url = "https://maven.ajitech.top/releases"
            credentials(PasswordCredentials) {
                username = 'aji'
                password = System.getenv("AJI_MAVEN_TOKEN_PASSWORD")
            }
        }
    }
}